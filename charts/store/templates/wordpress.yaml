apiVersion: v1
kind: Service
metadata:
  name: {{ include "store.name" . }}-wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 80, targetPort: http }
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: wordpress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store.name" . }}-wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: wordpress
  template:
    metadata:
      annotations:
        checksum/health: {{ include (print $.Template.BasePath "/health-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/component: wordpress
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [NET_RAW] }
          ports:
            - { name: http, containerPort: 80 }
          env:
            - { name: WORDPRESS_DB_HOST, value: {{ printf "%s-mysql" (include "store.name" .) | quote }} }
            - { name: WORDPRESS_DB_NAME, value: {{ .Values.mysql.database | quote }} }
            - { name: WORDPRESS_DB_USER, value: {{ .Values.mysql.user | quote }} }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret must name a pre-created database Secret" .Values.existingSecret }}
                  key: mysql-password
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('DISALLOW_FILE_EDIT', true);
                define('AUTOMATIC_UPDATER_DISABLED', true);
          startupProbe:
            httpGet: { path: /live.php, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ready.php, port: http }
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            httpGet: { path: /live.php, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - { name: content, mountPath: /var/www/html }
            - { name: health, mountPath: /etc/apache2/conf-enabled/zz-safe-access-log.conf, subPath: safe-access-log.conf, readOnly: true }
            - { name: health, mountPath: /var/www/html/live.php, subPath: live.php, readOnly: true }
            - { name: health, mountPath: /var/www/html/ready.php, subPath: ready.php, readOnly: true }
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: {{ include "store.name" . }}-wordpress
        - name: health
          configMap:
            name: {{ include "store.name" . }}-health
