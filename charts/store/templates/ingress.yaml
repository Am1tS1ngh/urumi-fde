apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "store.name" . }}-wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $host := concat (list (required "ingress.host must be configured" .Values.ingress.host)) .Values.ingress.extraHosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "store.name" $ }}-wordpress
                port: { name: http }
    {{- end }}
