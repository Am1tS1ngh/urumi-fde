apiVersion: v1
kind: Service
metadata:
  name: {{ include "store.name" . }}-mysql
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store.name" . }}-mysql
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Two database processes must never write to the same data directory.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/component: mysql
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mysql
          image: {{ .Values.mysql.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --innodb-buffer-pool-size={{ .Values.mysql.bufferPoolSize }}
            - --max-connections={{ .Values.mysql.maxConnections }}
            - --performance-schema=OFF
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [NET_RAW] }
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - { name: MYSQL_DATABASE, value: {{ .Values.mysql.database | quote }} }
            - { name: MYSQL_USER, value: {{ .Values.mysql.user | quote }} }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret must name a pre-created database Secret" .Values.existingSecret }}
                  key: mysql-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-root-password
          startupProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -u"$MYSQL_USER" "$MYSQL_DATABASE" --execute="SELECT 1" >/dev/null']
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -u"$MYSQL_USER" "$MYSQL_DATABASE" --execute="SELECT 1" >/dev/null']
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            tcpSocket: { port: mysql }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "store.name" . }}-mysql
