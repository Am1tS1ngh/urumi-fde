# Credentials are provisioned separately, never embedded in Helm values.
existingSecret: ""
mysql:
  image: mysql:8.4.11
  database: wordpress
  user: wordpress
  bufferPoolSize: 128M
  maxConnections: 50
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
wordpress:
  image: wordpress:7.1.3-php8.3-apache
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
persistence:
  # Empty: use the cluster default. Set a provisioned class for your VPS.
  storageClass: ""
  mysqlSize: 10Gi
  wordpressSize: 5Gi
ingress:
  className: traefik
  host: ""
  extraHosts: []
  tls: []
# Installs and configures WooCommerce after each deploy, and creates the adapter's API key.
setup:
  enabled: true
  image: wordpress:cli-2.12.0-php8.3
  # Secret with admin-user, admin-password, admin-email, consumer-key and consumer-secret.
  existingSecret: ""
  # Only used for a fresh install. An existing site keeps its URL.
  url: ""
  title: Urumi Store
  currency: INR
  woocommerceVersion: 11.2.1
