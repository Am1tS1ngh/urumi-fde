{{- define "platform.ingressPaths" -}}
paths:
  {{- range $path := list "/api" "/mcp" }}
  - path: {{ $path }}
    pathType: Prefix
    backend:
      service: { name: gateway, port: { name: http } }
  {{- end }}
  - path: /
    pathType: Prefix
    backend:
      service: { name: dashboard, port: { name: http } }
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      http:
        {{- include "platform.ingressPaths" . | nindent 8 }}
    {{- if .Values.ingress.matchAnyHost }}
    # Rules with a host name win, so this only catches requests to other names, like 127.0.0.1.
    - http:
        {{- include "platform.ingressPaths" . | nindent 8 }}
    {{- end }}
