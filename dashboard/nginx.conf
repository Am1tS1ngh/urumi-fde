server {
  listen 8080;
  root /usr/share/nginx/html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }
}
